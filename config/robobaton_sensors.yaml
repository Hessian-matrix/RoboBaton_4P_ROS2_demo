robobaton_sensors_node:
  ros__parameters:
    enable_camera: true
    enable_imu: true
    # Startup-only selectors; both IMU modes use the same kernel IIO capture.
    camera_timestamp_path: "observer"
    imu_timestamp_mode: "host"

    diagnostics:
      rate_metrics_enabled: false
      rate_log_period_ms: 1000
      rate_run_id: ""

    camera:
      camera_mask: 15
      fps: 30
      rotate_degrees: 0
      frame_set_max_skew_ns: 10000000
      frame_set_timeout_ms: 100
      queue_capacity: 4
      queue_policy: "block"
      publish_camera_info: true
      image_encoding: "nv12"
      publish_compressed_image: true
      compressed_jpeg_quality: 80
      frame_id_prefix: "robobaton_cam"
      trigger_mode: "vin_lpwm"

    imu:
      sample_rate_hz: 800
      fsync_diagnostics: true
      fifo_watermark_samples: 1
      buffer_capacity: 4096
      sample_drop_policy: "allow_counted"
      frame_id: "robobaton_imu_link"
      publish_temperature: true
